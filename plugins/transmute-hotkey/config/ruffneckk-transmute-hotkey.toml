# Transmute Hotkey
# Activates the native Transmute button while an integrated or standalone
# Horadric Cube panel is open. Restart D2R after editing this file.

# Master switch. false installs no Cube observation hook or input action.
enabled = true

# Keyboard only: A-Z, 0-9, F1-F24, Space, Tab, Insert, Delete, Home, End,
# PageUp, or PageDown, with zero or one Ctrl, Shift, or Alt modifier.
# Examples: "SHIFT+T", "CTRL+F5", "PAGEUP".
# Mouse buttons, controller buttons, and multi-modifier shortcuts are unsupported.
hotkey = "SHIFT+T"

[diagnostics]
# Logs the first successful dispatch or late refusal plus a final counter summary.
# Errors, warnings, startup messages, and the status command remain available
# when this is false. Leave disabled for normal play.
enabled = false
