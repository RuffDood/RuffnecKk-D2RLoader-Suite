# RuffnecKk MapSense configuration.
# Configure normal settings in the in-game MapSense menu.
# Edit navigation.custom_levels.targets and navigation.routing.overrides manually.

schema_version = 21

[general]
# Master switch for every MapSense feature. The settings panel remains available.
enabled = true
# Saved across games and difficulties; independent of GPS.
# Turning off stops revealing but does not hide cells already revealed.
reveal_map = false

[overlay]
# Legacy diagnostic-scene switch retained for schema 2 compatibility. Keep disabled.
diagnostic_preview = false
# Compatibility key: MapSense additions follow the native automap by design.
follow_native_automap = true
opacity = 1.00
scale = 1.00
frame_rate = 60

[monsters]
enabled = true

[monsters.normal]
shape = "player_cross"
color = "#FFFFFFFF"
size = 18.00
thickness = 2.00

[monsters.minion]
shape = "player_cross"
color = "#FFD43BFF"
size = 18.00
thickness = 2.00

[monsters.champion]
shape = "player_cross"
color = "#3D8BFFFF"
size = 20.00
thickness = 2.00

[monsters.unique]
shape = "player_cross"
color = "#FF8A24FF"
size = 22.00
thickness = 2.00

[monsters.super_unique_boss]
shape = "player_cross"
color = "#FF3B30FF"
size = 24.00
thickness = 2.00
show_names = true
name_color = "#FFD33DFF"
name_size = 28.00

[immunities]
enabled = true
# Uses colored letters above markers or a segmented halo around them.
style = "colored_i"
indicator_size = 14.00
halo_thickness = 2.00
physical = "#D8C39AFF"
fire = "#F23D1FFF"
cold = "#33A6FFFF"
lightning = "#FFE02EFF"
poison = "#57E03DFF"
magic = "#C75CFFFF"

[missiles]
enabled = true

[missiles.fire]
color = "#FF00007F"
size = 3.00

[missiles.cold]
color = "#00D0FF7F"
size = 3.00

[missiles.lightning]
color = "#FFFF0046"
size = 3.00

[missiles.poison]
color = "#32CD327F"
size = 3.00

[missiles.physical]
color = "#CD853F7F"
size = 3.00

[missiles.magic]
color = "#FF88007F"
size = 3.00

[objects]
enabled = true

[objects.exit_labels]
enabled = true
color = "#FFD33DFF"
size = 28.00

[objects.waypoint_labels]
enabled = true
color = "#FFD33DFF"
size = 28.00

[objects.shrine_labels]
enabled = true
color = "#FFD33DFF"
size = 28.00

[objects.chests]
enabled = true
outline_color = "#1450ADFF"
interior_color = "#B88A2AB0"
locked_accent_color = "#00FFFFFF"
trapped_accent_color = "#FF3B30FF"
size = 36.00

[objects.super_chests]
enabled = true
stars_enabled = true
stars_color = "#FFD33DFF"
stars_size = 28.00

[objects.armor_racks]
enabled = true
color = "#3D8BFFFF"
size = 36.00

[objects.weapon_racks]
enabled = true
color = "#FF8A24FF"
size = 36.00

[navigation]
# Configure this and every navigation switch/color in the MapSense menu.
line_thickness = 2.00

[navigation.waypoint]
enabled = true
line_mode = "direct"
color = "#3D8BFFFF"

[navigation.progression]
enabled = true
line_mode = "direct"
color = "#57E03DFF"

[navigation.quests]
# Marks static normal-quest routes and exact quest POIs, including the tomb.
enabled = true
line_mode = "direct"
color = "#FF3B30FF"

[navigation.custom_levels]
# This switch and color are also available in the MapSense menu.
enabled = false
line_mode = "direct"
color = "#C75CFFFF"
# Add destinations inside targets = [ ... ], one per line.
# Choose either an area ID or an English name for each entry:
#   { level_id = 12 },                 # Pit Level 1
#   { level_name = "Ancient Tunnels" }, # Keep names inside quotes
# You can mix ID and name entries; use a comma after each entry.
# If a name matches several areas, use its level_id instead.
# Enable Custom Levels in the MapSense menu to show these lines.
# Save this file and restart D2R after changing the destination list.
# A line appears when a chosen area is directly connected to your current area.
targets = [
  { level_id = 12 },                  # Pit Level 1
  { level_name = "Mausoleum" },       # levelId 19
  { level_name = "Ancient Tunnels" }, # levelId 65
  { level_id = 119 },                 # Icy Cellar
]

# Follow known campaign and quest shortcuts from the mod's loaded connections.
[navigation.routing]
adapt_to_mod_connections = true
# Show supported town shortcuts, such as green Docks -> Travincal or red Lut Gholein -> Sewers 3.
town_shortcuts = false
# Optional explicit routes for ambiguous or new connections. The destination
# must be directly connected. Save and restart D2R after editing this list.
# { from_level_id = 129, to_level_id = 131, kind = "progression" }
# { from_level_id = 43, to_level_id = 64, kind = "quest" }
overrides = []

[menu]
# Remembers the Hide/Show Menu choice across games and restarts.
visible = true
# Changes only the MapSense settings panel palette.
theme = "sanctuary_gold"
# Scales only the MapSense settings panel. Use automatic for backbuffer-based scaling.
interface_scale = "automatic"
# Keeps a small movable MapSense launcher visible while the panel is collapsed.
show_launcher = true
# The full settings panel and its sections start closed in each new game.
# Saves the launcher/panel position in this file after dragging ends.
remember_position = true
position_x = 0.86
position_y = 0.04

[diagnostics]
# Logs reveal, renderer, input, and automap diagnostics. Leave disabled for normal play.
enabled = false
